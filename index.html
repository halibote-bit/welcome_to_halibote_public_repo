<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to halibote-bit's GitHub website.">
    <title>Welcome to Halibote</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #f5f7ff;
            background:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.35), transparent 32%),
                radial-gradient(circle at 80% 80%, rgba(56, 189, 248, 0.25), transparent 30%),
                #0b1020;
            overflow: hidden;
        }

        .card {
            width: min(720px, 100%);
            padding: 64px 48px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(18px);
        }

        .badge {
            display: inline-block;
            margin-bottom: 24px;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
            font-size: 14px;
        }

        h1 {
            margin-bottom: 18px;
            font-size: clamp(48px, 9vw, 82px);
            line-height: 1;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #ffffff, #a5b4fc, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p {
            max-width: 560px;
            margin: 0 auto;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 32px;
            padding: 12px 22px;
            border-radius: 12px;
            color: #0b1020;
            background: #f8fafc;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.18);
        }

        footer {
            margin-top: 36px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 48px 24px;
                border-radius: 22px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">GitHub Pages · Personal Website</div>

        <h1>Hello!</h1>

        <p>
            Welcome to my little corner of the internet.
            This website is served directly from GitHub.
            More projects, experiments, and ideas are on the way.
        </p>

        <a class="button" href="https://github.com/halibote-bit" target="_blank" rel="noopener noreferrer">
            Visit my GitHub
        </a>

        <footer>
            Built with HTML & CSS · Hosted by GitHub
        </footer>
    </main>
</body>
</html>
